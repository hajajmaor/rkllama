services:
  rkllama:
    container_name: rkllama
    build: .
    privileged: true
    networks:
      - inner
    volumes:
      - ./models:/opt/rkllama/models
    ports:
      # Host:Container
      - "8080:8080"
      - "11432:8080"
    restart: unless-stopped

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - inner
    command: tunnel run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      
networks:
  inner:
    driver: bridge
